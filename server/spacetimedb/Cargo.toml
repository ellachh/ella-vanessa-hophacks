[package]
name = "server"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.10.*" }
log = "0.4"
# Procedures talk to three JSON APIs (Nominatim, and xAI twice). Pure Rust,
# compiles to wasm without a shim.
serde_json = "1"
