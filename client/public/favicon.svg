<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="Scraps">
  <!--
    The board's own pin, not a borrowed logo. The teardrop is the same path as
    client/src/pins.ts, so the tab matches what is on the map.

    No crate glyph, deliberately. pins.ts notes that at 22px the interior is
    about 8px and anything finer turns to mush; a favicon renders at 16, so the
    silhouette has to carry it alone.

    The cream tile is there so the mark reads on a dark tab strip as well as a
    light one — a bare orange pin on transparent disappears against some
    browser themes.
  -->
  <rect width="32" height="32" rx="7" fill="#efebe2"/>
  <g transform="translate(9.4 7) scale(0.6)" fill="#c9741a">
    <path d="M11 0C4.93 0 0 4.93 0 11c0 7.8 11 19 11 19s11-11.2 11-19C22 4.93 17.07 0 11 0z"/>
  </g>
</svg>
